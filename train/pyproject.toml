[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "picoocr-train"
version = "0.1.0"
description = "PicoOCR's training pipeline - the line recognizer of the picoocr npm package"
license = "MIT"
authors = [
    {name = "Craig A. Hobbs", email = "craigahobbs@gmail.com"}
]
requires-python = ">=3.12"
# The training environment's packages, pinned as requirements.txt pins them (a unit test checks they match) - the unit
# tests run with exactly the training's versions
dependencies = [
    "numpy == 2.5.4",
    "pillow == 13.0.0",
    "torch == 2.14.1"
]

[project.urls]
Homepage = "https://github.com/craigahobbs/picoocr"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}
packages = ["picoocr_train"]
